# studyrag-mcp (03-mcp-server): protocol, server and conformance tests.
# The end-to-end stdio test needs project 1's downloaded models and sample index, so it skips itself here.
name: mcp-server
on:
  push:
    paths: ["03-mcp-server/**", "01-rag-from-scratch/src/**", "02-llm-evals/src/**", ".github/workflows/mcp-server.yml"]
  pull_request:
    paths: ["03-mcp-server/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: python -m pytest -q -rs
