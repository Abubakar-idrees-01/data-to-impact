[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyrag-mcp"
version = "0.1.0"
description = "MCP server: search, read and fact-check your own study notes (StudyRAG) and read evaluation runs (evalkit) from any AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
studyrag-mcp = "studyrag_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
