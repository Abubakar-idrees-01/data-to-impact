# Publish the portfolio's live demos to GitHub Pages:
#   /        evalkit's report (02-llm-evals/site)
#   /scout/  the agent's trace viewer (04-ai-agent/site)
#   /tinygpt/ the tiny GPT running in the browser (05-adaptive-llm/site); its int8 weights are not in git but in the
#            release `tinygpt-web-v1` (05-adaptive-llm/scripts/publish_web_weights.sh), downloaded here
name: pages
on:
  push:
    branches: [main]
    paths: ["02-llm-evals/site/**", "04-ai-agent/site/**", "05-adaptive-llm/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/scout _site/tinygpt/models
          cp -r 02-llm-evals/site/. _site/
          cp -r 04-ai-agent/site/. _site/scout/
          cp -r 05-adaptive-llm/site/. _site/tinygpt/
          gh release download tinygpt-web-v1 --repo "$GITHUB_REPOSITORY" --dir _site/tinygpt/models --pattern "*.bin" --pattern "*.json"
          mv _site/tinygpt/models/tokenizer.json _site/tinygpt/tokenizer.json
          ls -la _site/tinygpt _site/tinygpt/models
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
