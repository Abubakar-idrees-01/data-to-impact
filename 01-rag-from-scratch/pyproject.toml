[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studyrag"
version = "0.1.0"
description = "A private, offline study assistant: grounded Q&A with citations over your own slides, PDFs and notes (OCR included)."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abubakar Idrees" }]
keywords = ["rag", "retrieval", "bm25", "study", "ocr", "citations", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastembed>=0.9",
  "rapidocr>=3.10",
  "python-pptx>=1.0",
  "python-docx>=1.2",
  "pypdf>=7.1",
  "httpx>=0.28",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
local-llm = ["llama-cpp-python>=0.3.37"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Abubakar-idrees-01/data-to-impact/tree/main/01-rag-from-scratch"
Source = "https://github.com/Abubakar-idrees-01/data-to-impact"
Documentation = "https://github.com/Abubakar-idrees-01/data-to-impact/blob/main/01-rag-from-scratch/docs/SETUP.md"

[project.scripts]
studyrag = "studyrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
