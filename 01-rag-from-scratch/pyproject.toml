[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyrag"
version = "0.1.0"
description = "A private, offline study assistant: grounded Q&A, summaries, MCQs and flashcards from your own course material."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
studyrag = "studyrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
