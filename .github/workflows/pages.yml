# Publish the portfolio's live demos to GitHub Pages:
#   /        evalkit's report (02-llm-evals/site)
#   /scout/  the agent's trace viewer (04-ai-agent/site)
name: pages
on:
  push:
    branches: [main]
    paths: ["02-llm-evals/site/**", "04-ai-agent/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Assemble the site
        run: |
          mkdir -p _site/scout
          cp -r 02-llm-evals/site/. _site/
          cp -r 04-ai-agent/site/. _site/scout/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
