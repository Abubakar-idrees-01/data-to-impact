# Publish evalkit's report (02-llm-evals/site) to GitHub Pages: the portfolio's live demo.
name: pages
on:
  push:
    branches: [main]
    paths: ["02-llm-evals/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 02-llm-evals/site
      - id: deployment
        uses: actions/deploy-pages@v5
