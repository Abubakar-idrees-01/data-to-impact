[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-agent"
version = "0.1.0"
description = "A research and developer agent built from scratch: web research with citations, MCP tools, and human approval for every outward action"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abubakar Idrees" }]
dependencies = ["httpx>=0.28", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scout = "scout.cli:main"

[project.urls]
Repository = "https://github.com/Abubakar-idrees-01/data-to-impact/tree/main/04-ai-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
